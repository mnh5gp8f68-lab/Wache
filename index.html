<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wache</title>
<meta name="theme-color" content="#0c0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wache">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" hidden>
  <aside class="side" id="side">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="36" height="36">
      <div class="brand-txt"><b id="brandTitle">Wache</b><span id="brandSub"></span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="navbtn" type="button" data-go="settings" id="navSettings"></button>
      <button class="navbtn" type="button" id="lockNow"></button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="iconbtn menu" type="button" id="menuBtn" aria-label="Menü"></button>
      <div class="searchbox">
        <span class="sicon" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Alles durchsuchen: Name, Nummer, PDF …" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="clock"><b id="clock"></b><span id="date"></span></div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="lock" class="lock" hidden></div>
<div id="sheet" class="sheet-root"></div>
<div id="viewer" class="viewer" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/pdf.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
